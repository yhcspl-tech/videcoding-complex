<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>굿즈샵 - 관리자</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <h1>관리자 · 전체 결제내역</h1>
    <p class="sub">모든 회원의 주문과 결제 상태를 확인합니다.</p>

    <div id="admin-content" class="hidden">
      <div class="stats">
        <div class="card stat"><p class="label">결제완료 매출</p><p class="value" id="stat-revenue">-</p></div>
        <div class="card stat"><p class="label">결제완료 건수</p><p class="value" id="stat-paid">-</p></div>
        <div class="card stat"><p class="label">전체 주문</p><p class="value" id="stat-total">-</p></div>
        <div class="card stat"><p class="label">구매 회원 수</p><p class="value" id="stat-buyers">-</p></div>
      </div>

      <div class="toolbar">
        <input id="search" type="search" placeholder="이메일·주문명·주문번호 검색" aria-label="검색">
        <select id="status-filter" aria-label="상태 필터">
          <option value="ALL">전체 상태</option>
          <option value="PAID">결제완료</option>
          <option value="PENDING">결제대기</option>
          <option value="FAILED">결제실패</option>
        </select>
        <button id="refresh-btn" class="btn btn-outline btn-sm" type="button">새로고침</button>
      </div>

      <div class="table-wrap">
        <table class="data">
          <thead>
            <tr>
              <th>일시</th>
              <th>회원</th>
              <th>주문 내용</th>
              <th>결제수단</th>
              <th>상태</th>
              <th class="num">금액</th>
            </tr>
          </thead>
          <tbody id="order-rows"></tbody>
        </table>
      </div>
      <p class="note" id="row-count"></p>
    </div>
    <p id="admin-loading" class="loading">불러오는 중…</p>
  </main>

  <footer>테스트용 쇼핑몰입니다. 실제 결제가 일어나지 않습니다.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/admin.js"></script>
</body>
</html>
